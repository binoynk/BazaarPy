# ── fly.toml — Fly.io deployment configuration ───────────────────
#
# Usage:
#   1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
#   2. From the backend/ folder: fly launch   (first time)
#      Or to redeploy:           fly deploy
#   3. Set secrets (never commit .env!):
#        fly secrets set DATABASE_URL="postgresql+asyncpg://..."
#        fly secrets set FRONTEND_URL="https://your-vercel-app.vercel.app"
#
# Cost: ~$0–2/month on the free/hobby plan for a small FastAPI app.

app = "bazaar-api"          # Change this to a unique name on Fly.io
primary_region = "yyz"      # yyz = Toronto (closest to TSX data); change if needed

[build]
  # Fly.io looks for the Dockerfile in the same directory as fly.toml
  # Copy this fly.toml into backend/ alongside the Dockerfile when deploying
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = true   # Saves money — spins down when not in use
  auto_start_machines = true   # Auto-starts on first request

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"   # Sufficient for FastAPI + yfinance on small workloads
  cpus   = 1
